name: Exportar IP bloqueadas de Cloudflare

on:
  schedule:
    - cron: "1 6,18 * * *"
      timezone: "Europe/Madrid"
      
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Consultar Cloudflare Security Events
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          from datetime import datetime, timedelta, timezone

          token = os.environ["CF_API_TOKEN"]
          zone = os.environ["CF_ZONE_ID"]
          end = datetime.now(timezone.utc)
          start = end - timedelta(days=7)

          query = '''
          query BlockedIPs($zoneTag: string!, $since: Time!, $until: Time!) {
            viewer {
              zones(filter: { zoneTag: $zoneTag }) {
                firewallEventsAdaptive(
                  filter: {
                    datetime_geq: $since
                    datetime_leq: $until
                    action_in: ["block", "challenge", "managed_challenge", "js_challenge"]
                  }
                  limit: 10000
                  orderBy: [datetime_DESC]
                ) {
                  action
                  clientAsn
                  clientCountryName
                  clientIP
                  datetime
                  source
                  userAgent
                }
              }
            }
          }
          '''

          payload = {
              "query": query,
              "variables": {
                  "zoneTag": zone,
                  "since": start.isoformat().replace("+00:00", "Z"),
                  "until": end.isoformat().replace("+00:00", "Z"),
              },
          }

          req = urllib.request.Request(
              "https://api.cloudflare.com/client/v4/graphql",
              data=json.dumps(payload).encode(),
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
              },
          )

          with urllib.request.urlopen(req) as r:
              data = json.load(r)

          events = data["data"]["viewer"]["zones"][0]["firewallEventsAdaptive"]

          with open("blocked-ips.json", "w") as f:
              json.dump(events, f, indent=2, ensure_ascii=False)

          ips = sorted({e["clientIP"] for e in events if e.get("clientIP")})
          with open("blocked-ips.txt", "w") as f:
              f.write("\n".join(ips) + ("\n" if ips else ""))
          PY

      - name: Confirmar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blocked-ips.txt blocked-ips.json
          git diff --cached --quiet || git commit -m "Actualizar IP bloqueadas: $(date -u +'%Y-%m-%d')"
          git push
